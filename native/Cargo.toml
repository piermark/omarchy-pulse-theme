[package]
name = "pulse-native"
version = "0.7.0"
edition = "2021"
license = "MIT"
description = "Omarchy Pulse, drawn natively in Rust (GPUI): a parallel renderer that reads the same hub as the web page."
publish = false

[[bin]]
name = "pulse-native"
path = "src/main.rs"

[dependencies]
gpui = { package = "gpui-ce", version = "=0.3.0", default-features = false, features = ["wayland", "font-kit"] }
gpui_platform = { package = "gpui_ce_platform", version = "=0.3.0", default-features = false, features = ["wayland"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false }
toml = "0.8"
anyhow = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
